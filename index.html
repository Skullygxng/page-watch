<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="page-watch">
  <title>page-watch</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0; padding: 1rem;
      max-width: 42rem; margin-inline: auto;
      background: light-dark(#fafafa, #111); color: light-dark(#222, #eee);
    }
    header h1 { font-size: 1.2rem; margin: 0; }
    header p { font-size: .8rem; color: gray; margin: .2rem 0 1rem; }
    .entry {
      border: 1px solid light-dark(#ddd, #333); border-radius: .5rem;
      padding: .8rem; margin-bottom: .8rem;
    }
    .entry .head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
    .entry .name { font-weight: 600; }
    .badge {
      font-size: .7rem; padding: .1rem .45rem; border-radius: .8rem;
      background: light-dark(#e8e8e8, #2a2a2a);
    }
    .badge.change { background: light-dark(#cfe8cf, #244224); }
    .badge.baseline { background: light-dark(#d8e4f0, #22303f); }
    .entry time { font-size: .75rem; color: gray; margin-left: auto; }
    .counts { font-size: .85rem; margin: .4rem 0; }
    .counts .add { color: light-dark(#1a7a1a, #6c6); }
    .counts .rem { color: light-dark(#a11, #c66); }
    .stamp { font-size: .8rem; color: gray; }
    details summary { font-size: .8rem; cursor: pointer; color: gray; margin-top: .4rem; }
    pre {
      font-size: .75rem; overflow-x: auto; padding: .5rem;
      background: light-dark(#f0f0f0, #1b1b1b); border-radius: .4rem;
      white-space: pre-wrap; word-break: break-word;
    }
    pre .add { color: light-dark(#1a7a1a, #6c6); }
    pre .rem { color: light-dark(#a11, #c66); }
    .link { font-size: .8rem; }
    table { border-collapse: collapse; font-size: .8rem; margin: .5rem 0; width: 100%; }
    th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid light-dark(#ddd, #333); }
    th { color: gray; font-weight: 500; }
    td.add { color: light-dark(#1a7a1a, #6c6); }
    td.rem { color: light-dark(#a11, #c66); }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.matrix th, table.matrix td { padding: .2rem .4rem; font-size: .7rem; white-space: nowrap; }
    tr.alarm td { background: light-dark(#fdecec, #3a1d1d); }
    footer { font-size: .75rem; color: gray; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>page-watch</h1>
    <p id="status">loading…</p>
  </header>
  <main id="log"></main>
  <section id="rates"></section>
  <section id="matrix"></section>
  <section id="simlog"></section>
  <footer>Checked every morning by GitHub Actions. Refreshes itself every 10 minutes.</footer>

  <script>
    const log = document.getElementById('log');
    const rates = document.getElementById('rates');
    const matrix = document.getElementById('matrix');
    const simlog = document.getElementById('simlog');
    const status = document.getElementById('status');

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function diffHtml(lines) {
      return lines
        .map(l => l.startsWith('+') ? `<span class="add">${esc(l)}</span>`
               : l.startsWith('-') ? `<span class="rem">${esc(l)}</span>`
               : esc(l))
        .join('\n');
    }

    function textEntryHtml(e) {
      return `
        <section class="entry">
          <div class="head">
            <span class="name">${esc(e.name)}</span>
            <span class="badge ${esc(e.type)}">${esc(e.type)}</span>
            <time>${esc((e.timestamp || '').replace('T', ' ').replace('Z', ' UTC'))}</time>
          </div>
          <div class="counts"><span class="add">+${e.lines_added}</span> <span class="rem">−${e.lines_removed}</span></div>
          ${e.stamp_changed ? `<div class="stamp">stamp: “${esc(e.stamp_before || 'none')}” → “${esc(e.stamp_after || 'none')}”</div>` : ''}
          ${(e.diff && e.diff.length) ? `<details><summary>show diff</summary><pre>${diffHtml(e.diff)}</pre></details>` : ''}
          <a class="link" href="${esc(e.url)}" rel="noopener">open page ↗</a>
        </section>`;
    }

    function ratesHtml(entries) {
      const byPage = {};
      entries.forEach(e => {
        if (e.simulated) return;
        const value = (e.current !== undefined) ? e.current : e.value;
        if (value === undefined) return;
        (byPage[e.name] = byPage[e.name] || []).push({
          t: e.timestamp, v: value, delta: e.delta, url: e.url,
        });
      });
      const names = Object.keys(byPage);
      if (!names.length) return '';
      return names.map(name => {
        const points = byPage[name].sort((a, b) => b.t.localeCompare(a.t));
        const newest = points[0];
        const last7 = points.slice(0, 7);
        const deltas = last7.filter(p => p.delta !== undefined).map(p => p.delta);
        const sum = deltas.reduce((s, d) => s + d, 0);
        let rateLine = 'no moves logged yet — this is the normal day being measured';
        if (deltas.length) {
          const days = Math.max(1, Math.round((Date.parse(newest.t) - Date.parse(last7[last7.length - 1].t)) / 86400000));
          const rate = Math.round(sum / days);
          rateLine = `<strong>${rate > 0 ? '+' : ''}${rate.toLocaleString()}</strong> a day over the last ${days} day${days === 1 ? '' : 's'} (${deltas.length} logged move${deltas.length === 1 ? '' : 's'})`;
        }
        const rows = last7.map(p => `
          <tr>
            <td>${esc(p.t.slice(0, 10))}</td>
            <td>${p.v.toLocaleString()}</td>
            <td class="${p.delta > 0 ? 'add' : p.delta < 0 ? 'rem' : ''}">${p.delta !== undefined ? (p.delta > 0 ? '+' : '') + p.delta.toLocaleString() : '—'}</td>
          </tr>`).join('');
        return `
          <section class="entry">
            <div class="head"><span class="name">${esc(name)} — number watch</span></div>
            <div class="counts">${rateLine}</div>
            <table>
              <tr><th>date</th><th>value</th><th>change</th></tr>
              ${rows}
            </table>
            <a class="link" href="${esc(newest.url)}" rel="noopener">open page ↗</a>
          </section>`;
      }).join('');
    }

    function matrixHtml(entries) {
      const pages = {};
      entries.forEach(e => {
        if (e.type !== 'number' || e.delta === undefined || e.simulated) return;
        const d = (e.timestamp || '').slice(0, 10);
        if (!d) return;
        (pages[e.name] = pages[e.name] || {})[d] = e.delta;
      });
      const names = Object.keys(pages).sort();
      if (!names.length) return '';
      const dateSet = new Set();
      names.forEach(n => Object.keys(pages[n]).forEach(d => dateSet.add(d)));
      const dates = [...dateSet].sort().reverse().slice(0, 14);
      const alarmAt = Math.max(2, Math.ceil(names.length / 3));
      const rows = dates.map(d => {
        let drops = 0;
        const cells = names.map(n => {
          const delta = pages[n][d];
          if (delta === undefined) return '<td>·</td>';
          if (delta < 0) drops++;
          const cls = delta > 0 ? 'add' : delta < 0 ? 'rem' : '';
          return `<td class="${cls}">${(delta > 0 ? '+' : '') + delta.toLocaleString()}</td>`;
        }).join('');
        const alarm = drops >= alarmAt ? ' class="alarm"' : '';
        return `<tr${alarm}><td>${esc(d)}</td>${cells}<td class="${drops ? 'rem' : ''}">${drops ? drops + ' ↓' : '·'}</td></tr>`;
      }).join('');
      const head = names.map(n => `<th>${esc(n)}</th>`).join('');
      return `
        <section class="entry">
          <div class="head"><span class="name">cross-account daily changes</span></div>
          <div class="scroll">
            <table class="matrix">
              <tr><th>date</th>${head}<th>dropped</th></tr>
              ${rows}
            </table>
          </div>
          <div class="stamp">Row highlights when ${alarmAt}+ accounts drop the same day. · = quiet day for that account.</div>
        </section>`;
    }

    function simHtml(entries) {
      const sims = entries.filter(e => e.simulated);
      if (!sims.length) return '';
      return `
        <section class="entry">
          <div class="head"><span class="name">simulated test entries</span><span class="badge">test</span></div>
          <div class="stamp">Logged while a page's simulate flag was on in config.json. Shown here so the record is complete — but excluded from every rate and matrix calculation above. The math only ever sees real moves.</div>
          ${sims.map(e => `
            <div class="counts">${esc(e.name)}: ${e.previous.toLocaleString()} → ${e.current.toLocaleString()} (${(e.delta > 0 ? '+' : '') + e.delta.toLocaleString()}) <time>${esc((e.timestamp || '').replace('T', ' ').replace('Z', ' UTC'))}</time></div>
          `).join('')}
        </section>`;
    }

    async function load() {
      status.textContent = 'loading…';
      try {
        const res = await fetch(`data/changes.json?ts=${Date.now()}`);
        if (res.status === 404) {
          status.textContent = 'No log yet — the first run still has to arm the baseline snapshot.';
          log.innerHTML = '';
          rates.innerHTML = '';
          matrix.innerHTML = '';
          simlog.innerHTML = '';
          return;
        }
        const entries = await res.json();
        if (!entries.length) { status.textContent = 'Log is empty.'; return; }
        status.textContent = `Loaded ${entries.length} entr${entries.length === 1 ? 'y' : 'ies'} · ${new Date().toLocaleTimeString()}`;
        const textEntries = entries.filter(e => e.type !== 'number' && e.value === undefined);
        const numberEntries = entries.filter(e => e.type === 'number' || e.value !== undefined);
        log.innerHTML = textEntries.map(textEntryHtml).join('');
        rates.innerHTML = ratesHtml(numberEntries);
        matrix.innerHTML = matrixHtml(numberEntries);
        simlog.innerHTML = simHtml(numberEntries);
      } catch {
        status.textContent = 'Could not load the log.';
      }
    }

    load();
    setInterval(load, 10 * 60 * 1000);
  </script>
</body>
</html>
